plugins {
    id 'dev.kikugie.loom-back-compat'
}

version = "1.3.1+${sc.current.version}"
base.archivesName = 'LowDurabilitySwitcher'

def modern = sc.current.parsed >= '26.1'
def javaVersion = modern ? JavaVersion.VERSION_25 : JavaVersion.VERSION_21

repositories {
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${sc.current.version}"
    loomx.applyMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${property('deps.fabric_loader')}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${property('deps.fabric_api')}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${property('deps.cloth_config')}"
    modCompileOnly "com.terraformersmc:modmenu:${property('deps.modmenu')}"
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion.majorVersion)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = Integer.parseInt(javaVersion.majorVersion)
}

processResources {
    def values = [version: project.version, minecraft: project.property('mod.mc_compat'),
                  java: javaVersion.majorVersion, loader: project.property('deps.fabric_loader')]
    inputs.properties(values)
    filesMatching('fabric.mod.json') { expand(values) }
}

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) { rename { "${it}_LowDurabilitySwitcher" } }
}
